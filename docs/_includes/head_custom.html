<link rel="stylesheet" href="/assets/css/custom.css" />

<script>
    const acronyms = {
        OISZh: "Reusable Launch Vehicle",
        Nkr: "Altitude",
        OS: "Orbitalnyy Samolet | Orbital Plane; Orbiter",
        OS: "Orbitalnyy Korabl | Orbital Ship; Orbiter",
        Vk: "delta V",
        DU: "Dvigatelnaya Ustanovka | Propulsion Unit",
        Ts: "Tsentralnyy (Blok) | Core (Stage)",
    };

    document.addEventListener("DOMContentLoaded", function () {
        const walker = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
        );
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach((node) => {
            let html = node.textContent;
            let changed = false;
            for (const [abbr, full] of Object.entries(acronyms)) {
                const escaped = abbr.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                const regex = new RegExp(
                    `(?<![\\w\\u0400-\\u04FF-])${escaped}(?!'[sS])(?![\\w\\u0400-\\u04FF-])`,
                    "g",
                );
                if (regex.test(html)) {
                    html = html.replace(
                        regex,
                        `<abbr title="${full}">${abbr}</abbr>`,
                    );
                    changed = true;
                }
            }
            if (changed) {
                const span = document.createElement("span");
                span.innerHTML = html;
                node.parentNode.replaceChild(span, node);
            }
        });
    });
</script>
